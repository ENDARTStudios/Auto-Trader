# docker-compose.yml — S01 0.4 + S13 pgvector + S14 ollama
# Uso:
#   cp .env.example .env   # e ajuste DATABASE_URL para postgres em prod
#   docker compose up -d   # sobe postgres (pgvector) + ollama
#   npx prisma migrate deploy   # aplica migrations em postgres
#   docker compose exec ollama ollama pull nomic-embed-text   # embeddings RAG
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: autotrader-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autotrader
      POSTGRES_PASSWORD: autotrader
      POSTGRES_DB: autotrader
      POSTGRES_INITDB_ARGS: "--auth=trust"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotrader -d autotrader"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks: [autotrader]

  ollama:
    image: ollama/ollama:latest
    container_name: autotrader-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [autotrader]

volumes:
  pgdata:
  ollama:

networks:
  autotrader:
    name: autotrader
