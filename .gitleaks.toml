# .gitleaks.toml — allowlist p/ falsos positivos de test fixtures (T044)
# Gitleaks 8.24: este arquivo complementa a config default (não a substitui).
# Mantido mínimo e documentado (restrição T044). Não commitar segredos reais aqui.

title = "Auto Trader gitleaks config"

# Falsos positivos: endereços EVM mock (0x...) em fixtures de teste são
# confundidos com generic-api-key (entropia + hex longo). São dados públicos,
# não chaves. Allowlist por path resolve sem desabilitar a regra.
[allowlist]
  description = "fixtures e artefatos que não são segredos"
  paths = [
    "e2e/s27.spec.ts",
    "scripts/seed-flags.ts",
    "scripts/seed-auth.ts",
    "prisma/test.db",
    "prisma/test.db-journal",
    "coverage/.*",
    ".next/.*",
  ]
  regexes = [
    "0x[a-fA-F0-9]{40}",
  ]
