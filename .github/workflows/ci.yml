name: CI — lint + typecheck + tests + SAST + audit + build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  # Gitleaks PR-mode comenta no PR (Resource not accessible by integration sem isso)
  pull-requests: write
  # CodeQL analyze consulta o workflow run (Get a workflow run precisa de actions:read)
  actions: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Postgres para os testes (provider postgresql desde a migração Railway 2026-11-01)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autotrader
          POSTGRES_PASSWORD: autotrader
          POSTGRES_DB: autotrader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autotrader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # T056: full history para o Gitleaks resolver o range de commits
      # (checkout raso quebrava o scan com 'unknown revision').
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Bun (for scripts that use bun)
        uses: oven-sh/setup-bun@v2

      - name: Install deps (frozen)
        run: npm ci

      # Prisma 7: postinstall não gera mais o client — obrigatório antes de lint/tsc
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Gitleaks — secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push test DB schema (for test:ci vault/signer)
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://autotrader:autotrader@localhost:5432/autotrader

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      - name: Tests — test:ci gate (637 checks)
        run: npm run test:ci
        env:
          DATABASE_URL: postgresql://autotrader:autotrader@localhost:5432/autotrader
          SIGNER_TEST_HOOKS: "1"

      - name: Tests — coverage (Vitest, baseline thresholds)
        run: npx vitest run --coverage --run
        env:
          DATABASE_URL: postgresql://autotrader:autotrader@localhost:5432/autotrader

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: npm run build

      - name: Arch — dependency-cruiser (no cycles, no chain→trading)
        run: npx -y dependency-cruiser --validate .dependency-cruiser.cjs src || echo "::warning::dep-cruiser violations (see docs/LINT.md)"

      - name: Knip — dead code (warn)
        run: npx -y knip --no-exit-code || echo "::warning::knip dead code (see docs/LINT.md)"

      - name: Build Docker image (multi-stage, pruned)
        if: hashFiles('Dockerfile') != ''
        run: docker build -t autotrader:ci -f Dockerfile . --target runner

      - name: Trivy — image scan (if Dockerfile exists)
        if: hashFiles('Dockerfile') != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autotrader:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
        continue-on-error: true

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # codeql-action/analyze consulta o workflow run (Get a workflow run)
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      # Repo privado sem GHAS: o upload ao code scanning exige Advanced Security
      # (decisão de compra do Operador). A análise roda igual; o gate fica LOCAL
      # no count de findings — nada de continue-on-error (lição T054).
      - uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: sarif-results
      - name: CodeQL — gate delta (falha só em finding em arquivo da PR)
        run: |
          jq -r '.runs[].results[] | "\(.ruleId) @ \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' sarif-results/javascript.sarif 2>/dev/null | sort -u > findings.txt || true
          count=$(wc -l < findings.txt | tr -d ' ')
          echo "CodeQL findings (total): $count"
          cat findings.txt
          # Modelo delta = mesmo critério dos PR alerts do code scanning:
          # finding pré-existente não bloqueia PRs alheias; finding em arquivo
          # tocado pela PR bloqueia. Nada é ocultado — tudo é impresso aqui.
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt || true
          failed=0
          while IFS= read -r line; do
            uri=$(printf '%s' "$line" | sed 's/^.*@ //; s/:[0-9]*$//')
            if grep -qxF "$uri" changed.txt; then
              echo "::error::CodeQL finding em arquivo da PR: $line"
              failed=1
            fi
          done < findings.txt
          exit $failed

  deploy-staging:
    if: github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to Fly.io staging (manual — requires FLY_API_TOKEN + STAGING_URL)
        run: |
          echo "Staging deploy stub — Fase 9.1.6. Configure FLY_API_TOKEN + STAGING_URL em vars/secrets e habilite vars.STAGING_ENABLED=true."
          echo "Manual: fly deploy --app auto-trader-staging (docs/DEPLOY.md:3) + curl -fsS $STAGING_URL/api/health/ready"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STAGING_URL: ${{ vars.STAGING_URL }}

  # E2E — só em PRs com label `e2e` ou push em main (evita custo em todo PR)
  e2e:
    if: contains(github.event.pull_request.labels.*.name, 'e2e') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autotrader
          POSTGRES_PASSWORD: autotrader
          POSTGRES_DB: autotrader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autotrader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Postgres de CI precisa de schema + seed: sem isso /api/health retorna 503
      # e o webServer do Playwright estoura o timeout de 120s (S39).
      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://autotrader:autotrader@localhost:5432/autotrader
      - run: npx tsx scripts/seed-auth.ts
        env:
          DATABASE_URL: postgresql://autotrader:autotrader@localhost:5432/autotrader
      - run: npx playwright install --with-deps
      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # 26+ logins paralelos estouram 5/60s e devolvem 429. Só existe na CI.
          E2E_RATE_LIMIT_BYPASS: "1"
          DATABASE_URL: postgresql://autotrader:autotrader@localhost:5432/autotrader
          SESSION_SECRET: test-session-secret-32-chars-minimum-for-ci-e2e
          ENCRYPTION_KEY: "base64:dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcy1iYXNlNjQ="
          SIGNER_TEST_HOOKS: "1"
