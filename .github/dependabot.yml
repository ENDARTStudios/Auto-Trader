version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    groups:
      prod:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dev:
        patterns: ["eslint*", "typescript", "tailwind*", "@types/*", "vitest*", "playwright*"]
        update-types: ["minor", "patch"]
    labels: ["deps", "chore"]
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    labels: ["deps", "ci"]
    commit-message:
      prefix: "ci"
